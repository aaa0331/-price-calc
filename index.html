  "retail", "bronze", "silver", "gold", "distributor",
  "seniorConsultant", "successBuilder", "supervisor",
];

const PRODUCTS = Object.entries(RAW).flatMap(([category, rows]) =>
  rows.map((r) => {
    const [code, name, vp, ...prices] = r;
    const obj = { category, code, name, vp, id: `${category}__${code}` };
    FIELD_ORDER.forEach((k, i) => (obj[k] = prices[i]));
    return obj;
  })
);
const PRODUCT_MAP = Object.fromEntries(PRODUCTS.map((p) => [p.id, p]));
const CATEGORIES = Object.keys(RAW);

function fmt(n) {
  return "NT$" + Math.round(n).toLocaleString("zh-TW");
}
function fmtVp(n) {
  return n.toLocaleString("zh-TW", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function tierLabel(key) {
  const t = TIERS.find((t) => t.key === key);
  return t ? t.label : key;
}
function rankFor(points) {
  return RANK_THRESHOLDS.find((r) => points >= r.min) || RANK_THRESHOLDS[RANK_THRESHOLDS.length - 1];
}

// ---------- local, per-device profile storage (private to this browser only) ----------
const PROFILE_KEY = "herbalife-price-diff-profile";
function loadProfile() {
  try {
    const raw = localStorage.getItem(PROFILE_KEY);
    return raw ? JSON.parse(raw) : {};
  } catch (e) {
    return {};
  }
}
function saveProfile(profile) {
  try {
    localStorage.setItem(PROFILE_KEY, JSON.stringify(profile));
  } catch (e) {
    // storage unavailable (e.g. private browsing) — ignore, stays in-memory only
  }
}

function App() {
  const initialProfile = loadProfile();
  const [tierA, setTierA] = useState("supervisor");
  const [tierB, setTierB] = useState("retail");
  const [search, setSearch] = useState("");
  const [category, setCategory] = useState("全部");
  const [cart, setCart] = useState({});
  const [accumPoints, setAccumPoints] = useState(0);
  const [avatar, setAvatar] = useState(initialProfile.avatar || null);
  const [displayName, setDisplayName] = useState(initialProfile.displayName || "");

  const handleAvatarUpload = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;
      setAvatar(dataUrl);
      saveProfile({ avatar: dataUrl, displayName });
    };
    reader.readAsDataURL(file);
  };

  const handleNameChange = (v) => {
    setDisplayName(v);
    saveProfile({ avatar, displayName: v });
  };

  const addToCart = (id) => setCart((c) => ({ ...c, [id]: (c[id] || 0) + 1 }));
  const changeQty = (id, delta) => {
    setCart((c) => {
      const next = { ...c, [id]: (c[id] || 0) + delta };
      if (next[id] <= 0) delete next[id];
      return next;
    });
  };
  const setQtyDirect = (id, val) => {
    const v = Math.max(1, Number(val) || 1);
    setCart((c) => ({ ...c, [id]: v }));
  };
  const removeFromCart = (id) => {
    setCart((c) => {
      const next = { ...c };
      delete next[id];
      return next;
    });
  };
  const clearCart = () => setCart({});

  const cartItems = Object.entries(cart)
    .map(([id, qty]) => ({ ...PRODUCT_MAP[id], qty }))
    .filter((i) => i.id);

  const totals = cartItems.reduce(
    (acc, item) => {
      const cost = item[tierA] * item.qty;
      const sell = item[tierB] * item.qty;
      acc.cost += cost;
      acc.sell += sell;
      acc.profit += sell - cost;
      acc.vp += item.vp * item.qty;
      return acc;
    },
    { cost: 0, sell: 0, profit: 0, vp: 0 }
  );

  const newTotalVp = accumPoints + totals.vp;
  const currentRank = rankFor(accumPoints);
  const newRank = rankFor(newTotalVp);
  const nextThreshold = RANK_THRESHOLDS.filter((r) => r.min > newTotalVp).sort((a, b) => a.min - b.min)[0];

      const matchCat = category === "全部" || p.category === category;

        !search ||
        p.name.includes(search) ||
        p.code.toLowerCase().includes(search.toLowerCase());
      return matchCat && matchSearch;
    });
  }, [search, category]);

          <div className="flex flex-col items-center gap-1.5 shrink-0">
            <label
              className="relative flex items-center justify-center rounded-full w-16 h-16 cursor-pointer overflow-hidden"
              style={{ background: "#2F5D2A", border: "2px solid #CBDDC3" }}
              title="上傳個人照片"
            >
              {avatar ? (
                <img src={avatar} alt="頭像" className="w-full h-full object-cover" />
              ) : (
                <Package size={24} color="#EAF2E3" />
              )}
              <input type="file" accept="image/*" onChange={handleAvatarUpload} className="absolute inset-0 opacity-0 cursor-pointer" />
            </label>
            <input
              type="text"
              value={displayName}
              onChange={(e) => handleNameChange(e.target.value)}
              placeholder="你的名字"
              className="w-24 text-center text-xs rounded-md border px-1.5 py-1"
              style={{ borderColor: "#CBDDC3", background: "#F8FBF6", color: "#233821" }}
            />
          </div>
        </div>

        {/* Tier selectors */}
        <div className="rounded-2xl p-5 mb-6" style={{ background: "#FFFFFF", boxShadow: "0 1px 0 #DDE7D5" }}>
          <div className="grid grid-cols-1 sm:grid-cols-[1fr_auto_1fr] gap-3 items-end">
            <div>
              <label className="text-xs font-medium" style={{ color: "#6B8F5E" }}>我的進貨身份（我的成本）</label>
              <select value={tierA} onChange={(e) => setTierA(e.target.value)} className="w-full mt-1 rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }}>
                {TIERS.map((t) => <option key={t.key} value={t.key}>{t.label}（{t.sub}）</option>)}
              </select>
            </div>
            <button
              onClick={() => { setTierA(tierB); setTierB(tierA); }}
              className="justify-self-center rounded-full p-2 mb-1"
              style={{ background: "#EAF2E3", border: "1px solid #CBDDC3" }}
              title="對調"
            >
              <ArrowLeftRight size={18} color="#2F5D2A" />
            </button>
            <div>
              <label className="text-xs font-medium" style={{ color: "#6B8F5E" }}>賣給對方的身份（對方付我的價格）</label>
              <select value={tierB} onChange={(e) => setTierB(e.target.value)} className="w-full mt-1 rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }}>
                {TIERS.map((t) => <option key={t.key} value={t.key}>{t.label}（{t.sub}）</option>)}
              </select>
            </div>
          </div>
        </div>

        {/* Cart summary */}
        <div className="rounded-2xl p-5 mb-6" style={{ background: "#20401D", color: "#EAF2E3" }}>
          <div className="flex items-center justify-between mb-3">
            <div className="flex items-center gap-2 text-sm opacity-90">
              <ShoppingBag size={16} />
              已選 {cartCount} 項產品
            </div>
            {cartCount > 0 && (
              <button onClick={clearCart} className="text-xs underline opacity-70 hover:opacity-100">清空清單</button>
            )}
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pb-4 mb-4" style={{ borderBottom: "1px solid rgba(234,242,227,0.15)" }}>
            <div>
              <div className="text-xs opacity-70">我的總成本</div>
              <div className="text-lg font-semibold">{fmt(totals.cost)}</div>
            </div>
            <div>
              <div className="text-xs opacity-70">對方總付款</div>
              <div className="text-lg font-semibold">{fmt(totals.sell)}</div>
            </div>
            <div>
              <div className="flex items-center gap-1 text-xs opacity-70"><TrendingUp size={12} /> 總利潤</div>
              <div className="text-lg font-bold" style={{ color: totals.profit >= 0 ? "#B7E4A0" : "#F3A6A6" }}>
                {totals.profit >= 0 ? "+" : "－"}{fmt(Math.abs(totals.profit))}
              </div>
            </div>
            <div>
              <div className="text-xs opacity-70">訂單總點數</div>
              <div className="text-lg font-semibold">{fmtVp(totals.vp)}</div>
            </div>
          </div>

          {cartItems.length === 0 ? (
            <div className="text-sm opacity-70 py-4 text-center">下方表格點「＋」把產品加入清單，可以一次加很多項一起算</div>
          ) : (
            <div className="space-y-2">
              {cartItems.map((item) => {
                const lineProfit = (item[tierB] - item[tierA]) * item.qty;
                return (
                  <div key={item.id} className="flex items-center gap-3 rounded-xl px-3 py-2" style={{ background: "rgba(234,242,227,0.08)" }}>
                    <div className="flex-1 min-w-0">
                      <div className="text-sm truncate">{item.name}</div>
                      <div className="text-xs opacity-60">{item.code}｜{fmtVp(item.vp)} 點/件</div>
                    </div>
                    <div className="flex items-center gap-1">
                      <button onClick={() => changeQty(item.id, -1)} className="rounded-full p-1" style={{ background: "rgba(234,242,227,0.15)" }}><Minus size={12} /></button>
                      <input type="number" min={1} value={item.qty} onChange={(e) => setQtyDirect(item.id, e.target.value)} className="w-10 text-center text-sm rounded-md py-0.5" style={{ background: "rgba(255,255,255,0.1)", color: "#EAF2E3" }} />
                      <button onClick={() => changeQty(item.id, 1)} className="rounded-full p-1" style={{ background: "rgba(234,242,227,0.15)" }}><Plus size={12} /></button>
                    </div>
                    <div className="text-sm font-semibold w-24 text-right" style={{ color: lineProfit >= 0 ? "#B7E4A0" : "#F3A6A6" }}>
                      {lineProfit >= 0 ? "+" : "－"}{fmt(Math.abs(lineProfit))}
                    </div>
                    <button onClick={() => removeFromCart(item.id)} className="opacity-60 hover:opacity-100"><XIcon size={14} /></button>
                  </div>
                );
              })}
            </div>
          )}
        </div>

        {/* Points tracker */}
        <div className="rounded-2xl p-5 mb-8" style={{ background: "#FFFFFF", boxShadow: "0 1px 0 #DDE7D5" }}>
          <div className="flex items-center gap-2 mb-3">
            <Gauge size={18} color="#2F5D2A" />
            <h2 className="text-base font-semibold" style={{ color: "#1F3B1E" }}>本月點數試算</h2>
          </div>
          <div className="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div>
              <label className="text-xs font-medium" style={{ color: "#6B8F5E" }}>目前已累積購貨點數</label>
              <input type="number" min={0} value={accumPoints} onChange={(e) => setAccumPoints(Math.max(0, Number(e.target.value) || 0))} className="w-full mt-1 rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }} />
              <div className="text-xs mt-1" style={{ color: "#9BB090" }}>對應等級：{currentRank.label}</div>
            </div>
            <div>
              <label className="text-xs font-medium" style={{ color: "#6B8F5E" }}>清單訂單點數</label>
              <div className="w-full mt-1 rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }}>
                {fmtVp(totals.vp)} 點（{cartCount} 項產品）
              </div>
            </div>
            <div>
              <label className="text-xs font-medium" style={{ color: "#6B8F5E" }}>累積後總點數</label>
              <div className="w-full mt-1 rounded-lg border px-3 py-2 text-sm font-semibold" style={{ borderColor: "#CBDDC3", background: "#EEF6E9", color: "#1F3B1E" }}>
                {fmtVp(newTotalVp)} 點
              </div>
              <div className="text-xs mt-1" style={{ color: "#2F5D2A" }}>
                對應等級：{newRank.label}
                {nextThreshold && (<span style={{ color: "#9BB090" }}>　再 {fmtVp(nextThreshold.min - newTotalVp)} 點可達 {nextThreshold.label}</span>)}
              </div>
            </div>
          </div>
          <p className="text-xs mt-3" style={{ color: "#9BB090" }}>
            等級對照僅依「簡化直銷商折扣等級表」的點數門檻概估，實際資格認定仍需依當月／累計月份與個人購貨點數等官方規則，請以公司系統結算為準。
          </p>
        </div>

        {/* Product browser */}
        <div className="rounded-2xl p-5" style={{ background: "#FFFFFF", boxShadow: "0 1px 0 #DDE7D5" }}>
          <div className="flex flex-col sm:flex-row gap-3 sm:items-center sm:justify-between mb-4">
            <h2 className="text-base font-semibold" style={{ color: "#1F3B1E" }}>
              產品清單：我進貨（{tierLabel(tierA)}）→ 賣給對方（{tierLabel(tierB)}）
            </h2>
            <div className="flex gap-2">
              <div className="flex items-center gap-2 rounded-lg border px-2 py-1.5" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }}>
                <Search size={14} color="#6B8F5E" />
                <input placeholder="搜尋品名或貨號" value={search} onChange={(e) => setSearch(e.target.value)} className="text-sm bg-transparent outline-none w-32" />
              </div>
              <select value={category} onChange={(e) => setCategory(e.target.value)} className="text-sm rounded-lg border px-2 py-1.5" style={{ borderColor: "#CBDDC3", background: "#F8FBF6" }}>
                <option value="全部">全部系列</option>
                {CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
              </select>
            </div>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-sm border-collapse">
              <thead>
                <tr style={{ color: "#6B8F5E" }} className="text-left">
                  <th className="py-2 pr-3 font-medium">產品</th>
                  <th className="py-2 px-2 font-medium text-right">點數</th>
                  <th className="py-2 px-2 font-medium text-right">我的成本</th>
                  <th className="py-2 px-2 font-medium text-right">對方付我</th>
                  <th className="py-2 px-2 font-medium text-right">單件利潤</th>
                  <th className="py-2 pl-2 font-medium text-center">加入</th>
                </tr>
              </thead>
              <tbody>
                {filtered.map((p) => {
                  const d = p[tierB] - p[tierA];
                  const inCart = !!cart[p.id];
                  return (
                    <tr key={p.id} style={{ borderTop: "1px solid #EEF3E9", background: inCart ? "#EEF6E9" : "transparent" }}>
                      <td className="py-2 pr-3">
                        <div style={{ color: "#233821" }}>{p.name}</div>
                        <div className="text-xs" style={{ color: "#9BB090" }}>{p.code}｜{p.category}</div>
                      </td>
                      <td className="py-2 px-2 text-right" style={{ color: "#9BB090" }}>{fmtVp(p.vp)}</td>
                      <td className="py-2 px-2 text-right" style={{ color: "#233821" }}>{fmt(p[tierA])}</td>
                      <td className="py-2 px-2 text-right" style={{ color: "#233821" }}>{fmt(p[tierB])}</td>
                      <td className="py-2 px-2 text-right font-semibold" style={{ color: d >= 0 ? "#2F5D2A" : "#B14646" }}>
                        {d >= 0 ? "+" : "－"}{fmt(Math.abs(d))}
                      </td>
                      <td className="py-2 pl-2 text-center">
                        <button
                          onClick={() => addToCart(p.id)}
                          className="inline-flex items-center gap-1 rounded-full px-2.5 py-1 text-xs font-medium"
                          style={{ background: inCart ? "#2F5D2A" : "#EAF2E3", color: inCart ? "#EAF2E3" : "#2F5D2A" }}
                        >
                          <Plus size={12} />
                          {inCart ? `×${cart[p.id]}` : "加入"}
                        </button>
                      </td>
                    </tr>
                  );
                })}
                {filtered.length === 0 && (
                  <tr><td colSpan={6} className="py-6 text-center" style={{ color: "#9BB090" }}>找不到符合的產品</td></tr>
                )}
              </tbody>
            </table>
          </div>
        </div>

        <p className="text-xs mt-6" style={{ color: "#9BB090" }}>
          價格已含 5% 加值營業稅，資料來源為 2026/06/17 版賀寶芙產品價目表。文宣品及輔銷品不適用折扣優惠，未列入本工具。實際交易金額與資格認定仍以官方訂購系統結算為準。個人照片與名字僅儲存在您自己這台裝置的瀏覽器中，不會上傳、也不會被其他使用者看到。
        </p>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
